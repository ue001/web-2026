<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Slide Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&family=Schibsted+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: tool chrome follows the slide's own rules — straight, sharp, black/white, hairlines.
   Left: controls with the axis system as the meeting picker. Right: dark stage, slide centred. */
:root{--paper:#fafaf9;--ink:#111;--mut:#7a7a7a;--line:#e4e4e2;--stage:#1b1b1b;--stage-ink:#9a9a9a;
--sans:"Inter",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121212;--ink:#eee;--mut:#8a8a8a;--line:#2a2a2a;--stage:#0a0a0a;--stage-ink:#777;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121212;--ink:#eee;--mut:#8a8a8a;--line:#2a2a2a;--stage:#0a0a0a;--stage-ink:#777;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.45 var(--sans)}
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;height:100vh;overflow:hidden}
aside{overflow-y:auto;overscroll-behavior:contain}
aside.right{border-right:0;border-left:1px solid var(--ink)}
.m2{font:10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.chosen b{font-weight:500;font-size:18px;letter-spacing:-.01em}
.export{position:sticky;bottom:0;margin-top:auto;display:flex;border-top:1px solid var(--ink);background:var(--paper)}
.export button{all:unset;flex:1;text-align:center;cursor:pointer;padding:12px 8px;font-size:13px;border-left:1px solid var(--ink)}
.export button:first-child{border-left:0}.export button:hover{background:var(--line)}
.export .pri{background:var(--ink);color:var(--paper)}.export .pri:hover{background:var(--ink);opacity:.85}
.export button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
aside{border-right:1px solid var(--ink);display:flex;flex-direction:column}
.brand{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px;border-bottom:1px solid var(--ink)}
.brand b{font-weight:500;font-size:14px;letter-spacing:-.01em}
.brand span{font:10px/1 var(--mono);color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.sec{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.h{display:flex;justify-content:space-between;font:10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.h em{font-style:normal;color:var(--ink)}
/* axis picker */
.pick{display:grid;grid-template-columns:1.1rem minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}
.pick .xl{font:10px/1 var(--mono);color:var(--mut);padding:0 0 6px 8px;text-transform:uppercase;letter-spacing:.05em}
.pick .yl{writing-mode:vertical-rl;transform:rotate(180deg);font:10px/1 var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding-left:4px}
.quad{border:1px solid var(--line);margin:-1px 0 0 -1px;padding:6px;display:flex;flex-direction:column;gap:1px;min-width:0}
.quad.on{border-color:var(--ink);position:relative;z-index:1}
.quad button[data-m^=Other]{color:var(--mut);font-size:15px;line-height:1}
.quad button{all:unset;cursor:pointer;font-size:12.5px;padding:3px 6px;line-height:1.3}
.quad button:hover{background:var(--line)}
.quad button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.quad button:focus-visible{outline:1px solid var(--ink)}
.rules{font:11px/1.5 var(--mono);color:var(--mut)}
.rules b{font-weight:400;color:var(--ink)}
/* image */
.src{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center}
.thumb{width:72px;aspect-ratio:16/9;background:#000 center/cover;border:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--ink)}
.seg>*{all:unset;flex:1;text-align:center;font-size:12px;padding:6px 4px;cursor:pointer;border-left:1px solid var(--ink)}
.seg>*:first-child{border-left:0}
.seg>*:hover{background:var(--line)}
.seg>[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg>*:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
/* sliders */
.sl{display:grid;grid-template-columns:5rem minmax(0,1fr) 2.2rem;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.sl span:last-child{text-align:right;font-family:var(--mono);font-size:12px}
.sl small{grid-column:2/3;display:flex;justify-content:space-between;font:10px/1 var(--mono);color:var(--mut);margin-top:-6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:14px;background:var(--ink);margin-top:-7px;border:0}
input[type=range]::-moz-range-thumb{width:10px;height:14px;background:var(--ink);border:0;border-radius:0}
input[type=range]:focus-visible{outline:1px solid var(--ink)}
.tg{display:flex;gap:8px;align-items:center;cursor:pointer}
.tg input{appearance:none;width:12px;height:12px;border:1px solid var(--ink);margin:0;display:grid;place-content:center}
.tg input:checked{background:var(--ink)}
.tg input:disabled{opacity:.5}
/* motion */
.modes{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.modes button{all:unset;cursor:pointer;font-size:12px;padding:7px 8px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.modes button:hover{background:var(--line)}
.modes button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.modes button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.fixed{font:11px/1.4 var(--mono);color:var(--mut)}
.fixed b{font-weight:400;color:var(--ink)}
input[type=text]{all:unset;box-sizing:border-box;width:100%;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
input[type=text]:focus{border-color:var(--ink)}
/* stage */
main{background:var(--stage);display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #2c2c2c;color:var(--stage-ink);font:11px/1 var(--mono)}
.top .acts{display:flex}
.top button{all:unset;cursor:pointer;color:#eee;font:12px/1 var(--sans);padding:8px 12px;border:1px solid #3a3a3a;margin-left:-1px}
.top button:hover{background:#2a2a2a}
.top button:focus-visible{outline:1px solid #eee}
.top button.pri{background:#eee;color:#111;border-color:#eee}
.view{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(16px,4vw,48px);gap:12px}
#stage{position:relative;width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;box-shadow:0 0 0 1px #2c2c2c}
main.drag #stage::after{content:"Drop image";position:absolute;inset:12px;border:1px dashed #eee;display:grid;place-items:center;color:#eee;font:12px var(--mono)}
canvas{display:block;width:100%;height:100%}
.cap{width:100%;max-width:1280px;display:flex;justify-content:space-between;gap:12px;color:var(--stage-ink);font:11px/1.4 var(--mono)}
.list{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp .gh{font:10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:0 0 6px;display:flex;justify-content:space-between}
.grp .gh em{font-style:normal}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;padding:4px;cursor:pointer;font-size:13px}
.row canvas{width:64px;height:36px;display:block;background:#000;outline:1px solid var(--line)}
.row:hover{background:var(--line)}
.row[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.row[aria-pressed=true] canvas{outline-color:var(--ink)}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.row .plus{width:64px;height:36px;border:1px dashed var(--mut);display:grid;place-items:center;color:var(--mut);box-sizing:border-box}
.row.add{color:var(--mut)}
[hidden]{display:none!important}
.adv summary{cursor:pointer;list-style:none}.adv summary::-webkit-details-marker{display:none}
.adv summary span::before{content:'+ '}.adv[open] summary span::before{content:'– '}
@media (max-width:1100px){.app{grid-template-columns:260px minmax(0,1fr) 260px}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}aside{border-right:0;border-bottom:1px solid var(--ink)}.view{padding:16px}.app{height:auto;overflow:visible}main{height:auto}aside.right{border-left:0;border-top:1px solid var(--ink)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* deck skin: one grotesk, sentence case, slide-navigator numbering, notes */
:root{--sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;--mono:var(--sans)}
body{font-family:var(--sans);font-variant-numeric:tabular-nums}
.h,.m2,.rules,.fixed,.pick .xl,.grp .gh,.top,.cap,.sl small,.sl span:last-child,#read,.lab{text-transform:none!important;letter-spacing:0!important;font-family:var(--sans)!important}
.h{font-size:12px;color:var(--mut)} .h span{color:var(--ink);font-weight:500} .h em{color:var(--mut)}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.015em}
.m2{font-size:12px}
.grp .gh{font-size:11.5px;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.list{counter-reset:slide}
.row{grid-template-columns:16px 64px minmax(0,1fr)!important;font-size:13.5px}
.row::before{counter-increment:slide;content:counter(slide);font-size:11px;color:var(--mut);text-align:right}
.row[aria-pressed=true]::before{color:var(--paper)}
.row.add{grid-template-columns:16px 64px minmax(0,1fr)!important}
.row.add::before{content:"";counter-increment:none}
.chosen b{font-size:28px;font-weight:500;letter-spacing:-.025em;line-height:1.05}
.fixed{font-size:12px;line-height:1.45}
.cap{font-size:12.5px;color:#a8a8a8;display:grid;grid-template-columns:3.5rem minmax(0,1fr) auto;gap:10px;align-items:baseline;border-top:1px solid #2c2c2c;padding-top:10px}
.cap::before{content:"Notes";color:#6f6f6f}
.top{font-size:12px}
.seg>*,.modes button,.export button,.top button{font-family:var(--sans)}
.transport{width:100%;max-width:1280px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:12px;align-items:center;color:#ddd}
.transport button{all:unset;cursor:pointer;min-width:30px;padding:0 6px;box-sizing:border-box;height:30px;display:grid;place-items:center;border:1px solid #3a3a3a;color:#eee;font-size:12px}
.transport button:hover{background:#2a2a2a}.transport button:focus-visible{outline:1px solid #eee}
#tc{font-size:12px;color:#a8a8a8;min-width:6.5em;text-align:right}
#scrub{-webkit-appearance:none;appearance:none;height:20px;background:transparent}
#scrub::-webkit-slider-runnable-track{height:2px;background:#4a4a4a}
#scrub::-moz-range-track{height:2px;background:#4a4a4a}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:16px;background:#eee;margin-top:-7px;border:0}
#scrub::-moz-range-thumb{width:3px;height:16px;background:#eee;border:0;border-radius:0}

/* spec-sheet skin: one ultramarine ink on paper, annotations on hairlines, dimension-line sliders */
:root,:root[data-theme="dark"]{--paper:#f4f4f2;--ink:#2236c8;--mut:rgba(34,54,200,.62);--line:rgba(34,54,200,.22);--tint:rgba(34,54,200,.07);--stage:#f4f4f2;--stage-ink:#2236c8;color-scheme:light;--sans:"DM Mono",ui-monospace,Menlo,monospace;--mono:var(--sans)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#f4f4f2;--ink:#2236c8;--mut:rgba(34,54,200,.62);--line:rgba(34,54,200,.22);--tint:rgba(34,54,200,.07);--stage:#f4f4f2;--stage-ink:#2236c8;color-scheme:light}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:12.5px}
aside,aside.right{border-color:var(--ink)}
.brand{border-bottom:1px solid var(--ink)} .brand b{font-weight:500;font-size:13px;letter-spacing:0;text-transform:lowercase}
.sec{border-bottom:0;gap:10px}
.h{border-bottom:1px solid var(--ink);padding-bottom:4px;align-items:flex-end;font-size:11.5px}
.h span{font-weight:400;color:var(--ink)} .h em{color:var(--mut);font-size:10.5px}
.grp .gh{color:var(--ink);border-bottom:1px solid var(--line);font-size:10.5px}
.row{grid-template-columns:22px 56px minmax(0,1fr)!important;gap:10px!important;font-size:12.5px;padding:4px 4px;border-bottom:1px solid var(--line)}
.row .plus{display:none}
.row canvas{display:block;width:56px;height:32px;outline:1px solid var(--line)}
.row[aria-pressed=true] canvas{outline-color:var(--paper)}
.row::before{content:counter(slide,decimal-leading-zero)!important;text-align:left;color:var(--mut);font-size:10.5px}
.row.add::before{content:"+"!important;color:var(--mut)}
.row.add{grid-template-columns:22px minmax(0,1fr)!important}
.row:hover{background:var(--tint)}
.row[aria-pressed=true]{background:var(--ink);color:var(--paper)} .row[aria-pressed=true]::before{color:var(--paper)}
.chosen b{font-size:40px;line-height:.92;letter-spacing:-.05em;text-transform:uppercase;font-weight:500}
.chosen .fixed{color:var(--mut)}
.fixed,.rules{color:var(--mut)} .fixed b,.rules b{color:var(--ink)}

input[type=range]{height:22px;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%) 0 15px/100% 5px no-repeat}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink);border-left:1px solid var(--ink);border-right:1px solid var(--ink)}

.seg,.modes,.export{border-color:var(--ink)} .seg>*,.modes button,.export button{border-color:var(--ink)!important;font-size:11px;text-transform:lowercase}
.seg>[aria-pressed=true],.modes button[aria-pressed=true],.export .pri{background:var(--ink);color:var(--paper)}
.seg>*:hover,.modes button:hover,.export button:hover{background:var(--tint)}
.thumb{border-color:var(--ink)}
input[type=text]{border-bottom-color:var(--line)} input[type=text]:focus{border-color:var(--ink)}
main{background:var(--stagebg);border-left:0;--stagebg:var(--paper);--sfg:var(--ink);transition:background .2s}
main[data-stage=black]{--stagebg:#141414;--sfg:#e8e8e8}

.stg span{color:var(--mut);margin-right:8px}

.txo{display:grid;grid-template-columns:auto 1fr;gap:8px}
.seg.mini>*{font-size:10.5px!important;padding:4px 7px!important;flex:0 0 auto}
.seg.mini .dot{display:inline-block;width:9px;height:9px;border-radius:50%;outline:1px solid var(--ink);vertical-align:-1px}
#tsh{justify-content:stretch}#tsh>*{flex:1 1 0!important}
#tpos>*{flex:1 1 0!important}
.recm{position:sticky;bottom:43px;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 18px;background:var(--paper);border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.recm + .export{margin-top:0}
#recm>*{min-width:4.5em;text-align:center}

/* click-to-edit values */
.sl>span,.num{position:relative;cursor:text}
.sl>span:hover::after,.num:hover::after{content:"click to edit";position:absolute;right:0;bottom:calc(100% + 4px);white-space:nowrap;font-size:10px;padding:2px 6px;background:var(--ink);color:var(--paper);pointer-events:none}
.sl>span[contenteditable=true]{outline:0;border-bottom:1px solid var(--ink);min-width:2ch}
.sl>span[contenteditable=true]::after,.num:focus-within::after{display:none}
.num input{background:transparent!important;border:0!important;border-bottom:1px solid transparent!important;padding:0 2px!important;width:3.4em!important;box-shadow:none!important;color:var(--ink)!important;-moz-appearance:textfield}
.num input:focus{border-bottom-color:var(--ink)!important}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* quick hint + mixed type */
.sl>span:hover::after,.num:hover::after{animation:tip 1.3s ease forwards}
@keyframes tip{0%{opacity:0;transform:translateY(2px)}12%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}
:root{--grot:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif}
.row{font-family:var(--grot)!important;font-size:14px!important;letter-spacing:-.005em}
.chosen b{font-family:var(--grot)!important;font-weight:500!important;letter-spacing:-.03em!important;font-size:42px!important}
.fld input[type=text]{font-family:var(--grot)!important;font-size:14px!important}
.brand b{font-family:var(--grot);font-size:15px;letter-spacing:-.01em;text-transform:none;font-weight:500}

/* compact layout */
.sec{padding:12px 18px!important;gap:8px!important}
.chosen{padding-top:14px!important;padding-bottom:2px!important}
.chosen b{font-size:30px!important}
.thumb{display:none!important}.src{grid-template-columns:1fr!important}
.list{gap:12px!important}
.row{padding:2px 4px!important;font-size:13px!important}
.row canvas{width:48px!important;height:27px!important}
.row{grid-template-columns:48px minmax(0,1fr)!important}
.grp .gh{margin-bottom:3px!important}
.gh em{display:flex;align-items:center;gap:8px}
.ghadd{all:unset;cursor:pointer;width:16px;height:16px;display:grid;place-items:center;border:1px solid var(--ink);color:var(--ink);font-size:11px;line-height:1}
.ghadd:hover{background:var(--ink);color:var(--paper)}
.ghadd:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.brand{padding:12px 18px!important}
.fld input[type=text]{padding:6px 8px!important}
.adv .fld{margin-top:4px}

/* left list back to the larger size */
.list{gap:18px!important}
.row{padding:5px 4px!important;font-size:14px!important;grid-template-columns:64px minmax(0,1fr)!important}
.row canvas{width:64px!important;height:36px!important}
.row.add{grid-template-columns:64px minmax(0,1fr)!important}
.row .plus{width:64px!important;height:36px!important}
.grp .gh{margin-bottom:6px!important}

.adv summary{position:relative}
.adv summary:hover::after{content:"fine-tune motion timing, treatment, studio name";position:absolute;left:0;right:0;bottom:calc(100% + 4px);white-space:normal;line-height:1.4;font-size:10px;padding:3px 7px;background:var(--ink);color:var(--paper);pointer-events:none;animation:tip 1.8s ease forwards;text-transform:none}
.adv[open] summary:hover::after{display:none}
</style>

<div class="app">
<aside class="left">
  <div class="brand"><b>generative title slide</b></div>
  <div class="sec">
    <div class="h"><span>01 use case</span></div>
    <div id="list" class="list"></div>
    <div class="rules" id="rules" hidden></div>
  </div>
</aside>

<main>
  <div class="top"><span id="read"></span>
  <div class="stg" role="group" aria-label="Stage"><button data-s="grey" aria-pressed="true">paper</button><button data-s="black" aria-pressed="false">black</button><button data-s="white" aria-pressed="false">white</button></div></div>
  <div class="view">
    <div id="stage"><canvas id="cv"></canvas></div>
    <div class="transport"><button id="play" aria-label="Pause" title="Play or pause (space)">❚❚</button><div class="tlw"><div id="holds"></div><input type="range" id="scrub" min="0" max="5" step="0.01" value="0" aria-label="Timeline"></div><span id="tc">0.0 / 5.0 s</span><button id="tostill" aria-label="Jump to the still frame" title="Jump to the still frame">still</button><button id="replay" aria-label="Back to start" title="Back to start">↺</button></div>
    <div class="cap"><span id="explain"></span><span id="state"></span></div>
  </div>
</main>

<aside class="right">
  <div class="sec chosen"><b id="aname">Kick-off</b></div>

  <div class="sec">
    <div class="h"><span>02 image</span><em id="srcname">sample</em></div>
    <div class="src"><div class="thumb" id="thumb"></div>
      <div class="seg" role="group" aria-label="Image source">
        <label tabindex="0" id="b-up">Upload<input id="up" type="file" accept="image/*" hidden></label>
        <button id="b-sample" aria-pressed="true">Sample</button><button id="b-none" aria-pressed="false">B&amp;W</button></div></div>
  </div>

  <div class="sec">
    <div class="h"><span>03 intensity</span></div>
    <div id="sliders" style="display:flex;flex-direction:column;gap:12px"></div>
    <input id="bw" type="checkbox" hidden>
  </div>

  <div class="sec">
    <div class="h"><span>04 background</span></div>
    <div class="seg" role="group" aria-label="Ground" id="ground"><button data-g="white">White</button><button data-g="black">Black</button><button data-g="image">Image</button><button data-g="treatment">Treatment</button></div>
  </div>

  <div class="sec">
    <div class="h"><span>05 motion</span><em id="mtag"></em></div>
    <div class="len"><span>length</span><input id="lenr" type="range" min="1" max="20" step="0.5" value="5" aria-label="Motion length"><label class="num"><input id="lenn" type="number" min="0.5" max="120" step="0.5" value="5" aria-label="Motion length in seconds"><span>s</span></label></div>
    <div class="modes" id="modes"></div>
    <div class="fixed" id="fixed"></div>
  </div>

  <div class="sec">
    <div class="h"><span>06 text</span></div>
    <label class="fld"><span>studio</span><input type="text" id="studio" value="Studio"></label>
    <label class="fld"><span>date</span><input type="text" id="date" placeholder="leave empty to hide"></label>
    <label class="fld"><span>subtitle</span><input type="text" id="sub"></label>
    <label class="fld"><span>title</span><input type="text" id="title" value="Generative Title Slide"></label>
    <div class="txo"><div class="seg mini" role="group" aria-label="Text color" id="tcol"><button data-c="auto" aria-pressed="true">auto</button><button data-c="black" aria-pressed="false" aria-label="Black text"><i class="dot" style="background:#111"></i></button><button data-c="white" aria-pressed="false" aria-label="White text"><i class="dot" style="background:#fff"></i></button></div>
      <div class="seg mini" role="group" aria-label="Behind the text" id="tsh"><button data-h="none" aria-pressed="true">none</button><button data-h="shadow" aria-pressed="false">shadow</button><button data-h="fade" aria-pressed="false">fade</button></div></div>
  </div>

  <details class="sec adv">
    <summary class="h"><span>advanced</span></summary>
    <div id="adv" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="fld"><span>text position</span><div class="seg mini" role="group" aria-label="Text position" id="tpos"><button data-p="bl">bottom</button><button data-p="ml">middle</button><button data-p="tl">top</button><button data-p="c">center</button></div></div>
    <div class="seg"><button id="advreset">Reset to system values</button></div>
  </details>

  <div class="recm"><span>video</span><div class="seg mini" role="group" aria-label="Video length" id="recm"><button data-r="loop" aria-pressed="true">loop</button><button data-r="intro" aria-pressed="false">intro</button></div></div>
  <div class="export"><button id="png">Save PNG · 4K</button><button id="rec" class="pri">Record loop</button></div>
</aside>
</div>

const SW=200,SH=112;
let img=new Image(),px=null,NONE=false;const CC={};
const $=id=>document.getElementById(id),cv=$('cv');
let SEED=0;
function hash(a,b){const s=Math.sin((a+SEED*.7319)*127.1+(b+SEED*1.371)*311.7)*43758.5;return s-Math.floor(s)}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function mv(){return Math.max(.02,Math.min(.45,ADV.mt/ADV.cycle))}
function pp(t,P){const x=(t%P)/P,h=mv();if(x<h)return ease(x/h);if(x<.5)return 1;if(x<.5+h)return 1-ease((x-.5)/h);return 0}

/* ---- source ---- */
function sample(){const c=document.createElement('canvas');c.width=SW;c.height=SH;const x=c.getContext('2d');
  const r=Math.max(SW/img.width,SH/img.height),w=img.width*r,h=img.height*r;x.drawImage(img,(SW-w)/2,(SH-h)/2,w,h);px=x.getImageData(0,0,SW,SH).data;
  for(const k in CC)delete CC[k];U.cache=null;drawThumbs()}
function col(u,v){const i=((Math.min(SH-1,v*SH|0))*SW+Math.min(SW-1,u*SW|0))*4;return[px[i],px[i+1],px[i+2]]}
function clusters(n){const key=n+'_'+SEED;if(CC[key])return CC[key];let cs=[];for(let i=0;i<n;i++)cs.push(col(hash(i,1),hash(i,2)));let cnt;
  for(let it=0;it<8;it++){const s=cs.map(()=>[0,0,0,0]);
    for(let i=0;i<px.length;i+=8){let bi=0,bd=1e9;for(let j=0;j<cs.length;j++){const c=cs[j],d=(c[0]-px[i])**2+(c[1]-px[i+1])**2+(c[2]-px[i+2])**2;if(d<bd){bd=d;bi=j}}
      s[bi][0]+=px[i];s[bi][1]+=px[i+1];s[bi][2]+=px[i+2];s[bi][3]++}
    cs=s.map((a,j)=>a[3]?[a[0]/a[3],a[1]/a[3],a[2]/a[3]]:cs[j]);cnt=s.map(a=>a[3])}
  return CC[key]=cs.map((c,i)=>({c,n:cnt[i]})).filter(o=>o.n).sort((a,b)=>b.n-a.n)}

/* ---- system ---- */
const QUAD={
 ec:{eng:'tree',tags:['External','Client','treemap','slide up · fixed'],a:['Division',3,120],b:['Colors',3,16]},
 en:{eng:'sweep',tags:['External','Non-client','mosaic','bands sweep · fixed'],a:['Bands',3,40],b:['Columns',4,200]},
 ic:{eng:'tree',tags:['Internal','Client','treemap','choose a motion'],a:['Division',3,200],b:['Colors',3,16],modes:['revealing','push, pull','size sets direction']},
 in:{eng:'sweep',tags:['Internal','Non-client','mosaic','choose a motion'],a:['Bands',3,40],b:['Columns',4,200],modes:['reveal','palette bloom','shuffle','thickness opens','push, pull']}};
const MEET={
 'Pitch':['ec',3,3],'Kick-off':['ec',9,6],'Client update':['ec',26,8],'Demo':['ec',5,4],'Keynote':['ec',55,12],
 'Conference':['en',16,130],'Meetup':['en',5,14],'PR deck':['en',34,200],
 'Internal project update':['ic',60,9,'revealing'],
 'Breakfast session':['in',24,90,'palette bloom'],'Intro':['in',8,30,'reveal'],'Team meeting':['in',38,170,'shuffle'],
 'Other ·ec':['ec',12,7],'Other ·en':['en',16,120],'Other ·ic':['ic',60,9,'revealing'],'Other ·in':['in',24,90,'palette bloom']};
const EXPLAIN={tree:'Treemap · each color takes the share of the slide it covers in the image',sweep:'Mosaic · the image glitches into bands and columns, then clears to disclose the picture'};
const ADV0={cycle:5,from:1,thin:75,swing:50,line:45,mt:1.75,pos:'bl'},ADV={...ADV0};
const U={bw:false,t0:0,ground:'white',seq:'inout'};let CUR='Kick-off';

function setMeet(){const m=CUR,[qid,A,B,mode]=MEET[m],q=QUAD[qid];SEED=mseed(m);
 Object.assign(U,{qid,eng:q.eng,A,B,modes:q.modes||null,mode:mode||null,cache:null,bk:null});
 U.ground=(mode==='reveal'||mode==='revealing')?'image':'white';U.seq='inout';syncSeg();
 const oth=m.startsWith('Other');$('aname').textContent=oth?'Other use case':m;$('sub').value=oth?'':m;$('sub').placeholder=oth?'Name your meeting':'';
 $('rules').innerHTML=`<b>${q.tags[2]}</b> · ${q.a[0].toLowerCase()} + ${q.b[0].toLowerCase()} · motion ${q.modes?'chosen':'fixed'}`;
 $('mtag').textContent=q.modes?'choose':'fixed';
 $('fixed').innerHTML=q.modes?'':`${q.tags[3].replace(' · fixed','')}`;
 $('sliders').innerHTML=[q.a,q.b].map((s,i)=>`<label class="sl">${s[0]}<input id="s${i}" type="range" min="${s[1]}" max="${s[2]}" value="${i?B:A}"><span id="v${i}">${i?B:A}</span><small><span>${s[1]}</span><span>${s[2]}</span></small></label>`).join('');
 [0,1].forEach(i=>$('s'+i).addEventListener('input',e=>{U[i?'B':'A']=+e.target.value;$('v'+i).textContent=e.target.value;U.cache=null;U.bk=null}));
 $('modes').innerHTML=(q.modes||[]).map(x=>`<button aria-pressed="${x===U.mode}">${x}</button>`).join('');
 $('modes').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{U.mode=b.textContent;if((U.mode==='reveal'||U.mode==='revealing')&&U.ground==='white')U.ground='image';syncSeg();restart();$('modes').querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',y===b))}));
 sync();axes();restart()}
const GROUPS=[['ec','External','Client'],['en','External','Non-client'],['ic','Internal','Client'],['in','Internal','Non-client']];
function axes(){$('list').innerHTML=GROUPS.map(([qid,a,b])=>`<div class="grp"><div class="gh"><span>${a} · ${b}</span><em>${QUAD[qid].eng==='tree'?'treemap':'mosaic'}<button class="ghadd" data-m="Other ·${qid}" title="Other use case" aria-label="Other use case">+</button></em></div>`+
  Object.keys(MEET).filter(k=>MEET[k][0]===qid).map(m=>m.startsWith('Other')
   ?(m===CUR?`<button class="row add" data-m="${m}" aria-pressed="true"><span class="plus">+</span>Other</button>`:'')
   :`<button class="row" data-m="${m}" aria-pressed="${m===CUR}"><canvas class="tc" width="128" height="72"></canvas>${m}</button>`).join('')+`</div>`).join('');
 $('list').querySelectorAll('.row,.ghadd').forEach(b=>b.addEventListener('click',()=>{CUR=b.dataset.m;setMeet();if(CUR.startsWith('Other'))$('sub').focus()}));drawThumbs()}
function mseed(m){return Object.keys(MEET).indexOf(m)*37+3}
function drawThumbs(){if(!px&&!NONE)return;const keep=SEED,save={...U},bw=BW;
 document.querySelectorAll('.row canvas').forEach(c=>{const m=c.parentNode.dataset.m,[qid,A,B,mode]=MEET[m],q=QUAD[qid],x=c.getContext('2d'),W=c.width,H=c.height;
  SEED=m===CUR?keep:mseed(m);
  Object.assign(U,{qid,eng:q.eng,A,B,modes:q.modes||null,mode:mode||(q.modes?q.modes[0]:null),seq:'inout',cache:null,bk:null,
   ground:(mode==='reveal'||mode==='revealing')?'image':'white'});
  if(m===CUR){U.A=save.A;U.B=save.B;U.mode=save.mode;U.ground=save.ground}
  BW=NONE||U.bw;const Lc=ADV.cycle,h=mv(),mm=U.modes?U.mode:'';
  const fr=q.eng==='sweep'&&!U.modes?.3:mm==='palette bloom'?.5:mm==='thickness opens'?.75:mm==='reveal'?.6:.55;
  const t=NONE?Lc*.64*.12:(mm==='push, pull'||mm==='shuffle')?1.3:h*Lc*fr;
  if(NONE)noimg(x,W,H,t);else if(q.eng==='tree'){x.fillStyle='#fff';x.fillRect(0,0,W,H);buildLayout(U.A,U.B,W,H).cells.forEach(k=>{x.fillStyle=RGB(k.c);x.fillRect(Math.floor(k.X),Math.floor(k.Y),Math.ceil(k.w)+1,Math.ceil(k.h)+1)})}else sweep(x,W,H,t)});
 Object.assign(U,save);U.cache=null;U.bk=null;SEED=keep;BW=bw}

function sync(){if(typeof syncSeg==='function'&&$('ground'))setTimeout(syncSeg);$('modes').hidden=!U.modes||NONE;$('fixed').hidden=!!U.modes&&!NONE;if(NONE)$('fixed').innerHTML='black and white, no image';
 $('b-sample').setAttribute('aria-pressed',!NONE&&$('srcname').textContent==='sample');$('b-none').setAttribute('aria-pressed',NONE);$('bw').checked=NONE||U.bw;$('bw').disabled=NONE;
 $('explain').textContent=NONE?(U.eng==='tree'?'No image · blocks slide up off black, one by one above division 2':'No image · a quick black-and-white band cut'):EXPLAIN[U.eng]}
let PAUSED=false,PT=0;
function curT(){return PAUSED?PT:(performance.now()-U.t0)/1000}
function restart(){U.t0=performance.now();if(PAUSED)PT=0}
function setPause(p){if(p===PAUSED)return;if(p){PT=curT();PAUSED=true}else{U.t0=performance.now()-PT*1000;PAUSED=false}
 $('play').textContent=PAUSED?'▶':'❚❚';$('play').setAttribute('aria-label',PAUSED?'Play':'Pause')}

/* ---- render ---- */
let BW=false;
const RGB=c=>{if(BW){const y=(.3*c[0]+.59*c[1]+.11*c[2])|0;return`rgb(${y},${y},${y})`}return`rgb(${c.map(v=>v|0)})`};
function photo(x,W,H){const r=Math.max(W/img.width,H/img.height);x.filter=BW?'grayscale(1)':'none';x.drawImage(img,(W-img.width*r)/2,(H-img.height*r)/2,img.width*r,img.height*r);x.filter='none'}

function ground(x,W,H){const g=U.ground;

 BW=NONE||U.bw;U.cache=null;U.bk=null;if(NONE)noimg(x,3840,2160,t);else if(px)(U.eng==='tree'?tree:sweep)(x,3840,2160,t);text(x,3840,2160);U.cache=null;U.bk=null;
 c.toBlob(b=>{save(b,'title-slide-4k.png');$('state').textContent='saved title-slide-4k.png · 3840×2160'})});
$('rec').addEventListener('click',()=>{if(!window.MediaRecorder){$('state').textContent='This browser cannot record video.';return}
 const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'],type=types.find(t=>MediaRecorder.isTypeSupported(t));
 if(!type){$('state').textContent='This browser cannot record video.';return}
 const mr=new MediaRecorder(cv.captureStream(60),{mimeType:type,videoBitsPerSecond:12e6}),ch=[];
 mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
 mr.onstop=()=>{const n='title-slide'+(type.includes('mp4')?'.mp4':'.webm');save(new Blob(ch,{type}),n);$('state').textContent='saved '+n;$('rec').textContent=REC==='loop'?'Record loop':'Record intro'};
 restart();mr.start();$('rec').textContent='Recording…';setTimeout(()=>mr.state!=='inactive'&&mr.stop(),recLen()*1000+150)});
let REC='loop';
function recLen(){const L=ADV.cycle*(NONE?.64:1);if(REC==='loop')return L;const H=holds();return H.length?Math.min(L,H[0][1]*L):L}
document.querySelectorAll('#recm button').forEach(b=>b.addEventListener('click',()=>{REC=b.dataset.r;$('rec').textContent=REC==='loop'?'Record loop':'Record intro';
 document.querySelectorAll('#recm button').forEach(y=>y.setAttribute('aria-pressed',y===b));$('state').textContent=REC==='loop'?'':'intro · '+recLen().toFixed(1)+' s, ends on the still'}));

function syncSeg(){document.querySelectorAll('#ground button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===U.ground));
 document.querySelectorAll('#seq button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===U.seq));
 const sq=$('seq');if(sq)sq.hidden=!(U.eng==='tree'&&!U.modes)||NONE}
document.querySelectorAll('#ground button').forEach(b=>b.addEventListener('click',()=>{U.ground=b.dataset.g;syncSeg()}));
document.querySelectorAll('#seq button').forEach(b=>b.addEventListener('click',()=>{U.seq=b.dataset.s;syncSeg();restart()}));
const ADVDEF=[['mt','Motion time','s',.3,5,.05],['from','Sweep from','bands',1,10,1],['thin','Opens to','%',10,95,5],['swing','Push, pull','%',10,100,5],['line','Hairline','%',0,100,5]];
function syncLen(){$('lenr').value=Math.min(20,ADV.cycle);if(document.activeElement!==$('lenn'))$('lenn').value=ADV.cycle}
function setLen(v){if(!(v>=.5))return;v=Math.min(120,v);const L=curT()%ADV.cycle/ADV.cycle;ADV.cycle=v;syncLen();if(PAUSED)PT=L*ADV.cycle;else U.t0=performance.now()-L*ADV.cycle*1000}
$('lenr').addEventListener('input',e=>{setLen(+e.target.value);$('lenn').value=ADV.cycle});
$('lenn').addEventListener('input',e=>setLen(parseFloat(e.target.value)));
$('lenn').addEventListener('blur',()=>{$('lenn').value=ADV.cycle});
function advUI(){syncLen();$('adv').innerHTML=ADVDEF.map(([k,l,u,mn,mx,st])=>`<label class="sl">${l}<input id="a-${k}" type="range" min="${mn}" max="${mx}" step="${st}" value="${ADV[k]}"><span id="av-${k}">${ADV[k]}</span><small><span>${mn}${u==='s'?'s':''}</span><span>${mx}${u==='%'?'%':u==='s'?'s':''}</span></small></label>`).join('');
 ADVDEF.forEach(([k])=>$('a-'+k).addEventListener('input',e=>{ADV[k]=+e.target.value;$('av-'+k).textContent=e.target.value;syncLen();if(k==='cycle'||k==='from')restart()}))}
function syncPos(){document.querySelectorAll('#tpos button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===ADV.pos))}
document.querySelectorAll('#tpos button').forEach(b=>b.addEventListener('click',()=>{ADV.pos=b.dataset.p;syncPos()}));syncPos();
$('advreset').addEventListener('click',()=>{Object.assign(ADV,ADV0);advUI();syncPos();syncLen();restart()});
advUI();

/* click a slider value to type it */
document.addEventListener('click',e=>{const sp=e.target.closest('.sl>span');if(!sp||sp.isContentEditable)return;const r=sp.parentNode.querySelector('input[type=range]');if(!r)return;
 const old=sp.textContent;sp.contentEditable='true';sp.focus();const sel=getSelection(),rg=document.createRange();rg.selectNodeContents(sp);sel.removeAllRanges();sel.addRange(rg);
 const done=ok=>{sp.contentEditable='false';sp.removeEventListener('keydown',kd);sp.removeEventListener('blur',bl);
  const v=parseFloat(sp.textContent.replace(',','.'));if(ok&&isFinite(v)){const mn=+r.min,mx=+r.max;r.value=Math.min(mx,Math.max(mn,v));r.dispatchEvent(new Event('input',{bubbles:true}))}else sp.textContent=old};
 const kd=ev=>{if(ev.key==='Enter'){ev.preventDefault();sp.blur()}else if(ev.key==='Escape'){ev.preventDefault();sp.textContent=old;done(false)}};
 const bl=()=>done(true);sp.addEventListener('keydown',kd);sp.addEventListener('blur',bl)});
